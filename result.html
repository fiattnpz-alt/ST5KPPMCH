<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ผลการประเมิน - แบบประเมินความเครียด</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>ผลการประเมินความเครียด</h1>
    <p class="subtitle">สรุปผลระดับความเครียดและคำแนะนำที่เหมาะสมสำหรับคุณ</p>
    
    <!-- Progress Indicator -->
    <div class="progress-container">
      <div class="progress-line"></div>
      <div class="progress-line-fill" style="width: 100%;"></div>
      <div class="progress-step completed">1</div>
      <div class="progress-step completed">2</div>
      <div class="progress-step completed">3</div>
    </div>

    <!-- Result Dashboard -->
    <div class="result-card">
      <div class="score-display" id="scoreDisplay">0 <span class="score-total">/ 15 คะแนน</span></div>
      
      <div class="result-badge" id="resultBadge">กำลังคำนวณ...</div>
      
      <div id="resultAdvice" style="margin: 15px 0; font-size: 15px; text-align: left; background-color: #fafafa; padding: 15px; border-radius: 8px; border-left: 4px solid var(--primary-color);">
        คำแนะนำจะแสดงผลตามระดับความเครียดของคุณ
      </div>

      <!-- User Info Summary -->
      <div class="user-info-summary">
        <h3 style="font-size: 16px; margin-bottom: 12px;">ข้อมูลผู้ลงทะเบียน</h3>
        <div class="user-info-item">
          <span class="user-info-label">ชื่อ-นามสกุล</span>
          <span class="user-info-value" id="summaryName">-</span>
        </div>
        <div class="user-info-item">
          <span class="user-info-label">เลขบัตรประชาชน</span>
          <span class="user-info-value" id="summaryCitizenId">-</span>
        </div>
        <div class="user-info-item">
          <span class="user-info-label">เบอร์โทรศัพท์</span>
          <span class="user-info-value" id="summaryPhone">-</span>
        </div>
        <div class="user-info-item">
          <span class="user-info-label">ที่อยู่</span>
          <span class="user-info-value" id="summaryAddress">-</span>
        </div>
      </div>

      <!-- Mental Health Screening Summary -->
      <div class="user-info-summary" style="margin-top: 15px; border-top: 1px dashed var(--border-color); padding-top: 15px;">
        <h3 style="font-size: 16px; margin-bottom: 12px;">ผลการตรวจคัดกรองร่วม</h3>
        <div class="user-info-item">
          <span class="user-info-label">ภาวะซึมเศร้า (2Q)</span>
          <span class="user-info-value" id="summaryDepression" style="font-weight: 700;">-</span>
        </div>
        <div class="user-info-item">
          <span class="user-info-label">ความเสี่ยงทำร้ายตนเอง (1Q)</span>
          <span class="user-info-value" id="summarySuicide" style="font-weight: 700;">-</span>
        </div>
      </div>

      <button id="restartBtn" class="btn" style="margin-top: 25px;">ทำแบบประเมินใหม่</button>
    </div>
  </div>

  <script src="js/result.js"></script>
</body>
</html>
